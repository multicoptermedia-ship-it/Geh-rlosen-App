name: Android build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch offline speech models
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="app/src/main/assets/sherpa-onnx-nemo-stt_de_fastconformer_hybrid_large_pc-int8"
          MODEL_REVISION="e8069b7f76b407780f1aca3388ec2a53f57a2603"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 3 \
            "https://huggingface.co/csukuangfj/sherpa-onnx-nemo-stt_de_fastconformer_hybrid_large_pc-int8/resolve/${MODEL_REVISION}/model.int8.onnx" \
            --output "$MODEL_DIR/model.int8.onnx"
          curl --fail --location --retry 3 \
            "https://huggingface.co/csukuangfj/sherpa-onnx-nemo-stt_de_fastconformer_hybrid_large_pc-int8/resolve/${MODEL_REVISION}/tokens.txt" \
            --output "$MODEL_DIR/tokens.txt"
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" \
            --output "app/src/main/assets/silero_vad.onnx"
          test -s "$MODEL_DIR/model.int8.onnx"
          test -s "$MODEL_DIR/tokens.txt"
          test -s "app/src/main/assets/silero_vad.onnx"

          # Speaker embedding model: WeSpeaker VoxCeleb ResNet34 (CC BY 4.0).
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx" \
            --output "app/src/main/assets/wespeaker_en_voxceleb_resnet34.onnx"
          test -s "app/src/main/assets/wespeaker_en_voxceleb_resnet34.onnx"

      - name: Verify privacy manifest
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Privacy check failed: INTERNET permission must not be declared."
            exit 1
          fi
          grep -q 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify built APK privacy
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q 'android.permission.INTERNET'; then
            echo "Privacy check failed: built APK contains INTERNET permission."
            exit 1
          fi

      - name: Name and checksum smartphone test APK
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          cp app-debug.apk Gespraech-Live-0.2.1-offline-test.apk
          sha256sum Gespraech-Live-0.2.1-offline-test.apk > Gespraech-Live-0.2.1-offline-test.apk.sha256

      - name: Upload smartphone test APK
        uses: actions/upload-artifact@v4
        with:
          name: gespraech-live-0.2.1-offline-test
          path: |
            app/build/outputs/apk/debug/Gespraech-Live-0.2.1-offline-test.apk
            app/build/outputs/apk/debug/Gespraech-Live-0.2.1-offline-test.apk.sha256
          if-no-files-found: error
